<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F2EE">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121311">
<meta name="robots" content="noindex">
<title>Not found · Human Use</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{
  color-scheme:light dark;
  --paper:#F3F2EE;--surface:#FBFAF7;--ink:#121311;--ink2:#62645E;--rule:#D8D6CF;--signal:#E4460A;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#121311;--surface:#1A1B19;--ink:#ECEBE6;--ink2:#9A9C95;--rule:#30322E;--signal:#FF6A2B}
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--ink);text-underline-offset:3px}
a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1380px;margin:0 auto;padding:0 24px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:46px;border-bottom:1px solid var(--ink)}
.brand{display:flex;gap:10px;align-items:center;font:600 13px/1 var(--sans);text-decoration:none;white-space:nowrap}
.brand img{width:18px;height:18px;display:block}
.nav{display:flex;gap:18px;font:500 12px/1 var(--mono);flex-wrap:wrap}
.nav a{text-decoration:none;color:var(--ink2)}
.nav a:hover{color:var(--ink)}
main{padding:56px 0 80px;max-width:640px}
h1{font:600 clamp(34px,4.6vw,60px)/1 var(--sans);letter-spacing:-.03em;margin:0}
.line{margin:22px 0 0;border:1px solid var(--ink);background:var(--surface);padding:14px 16px;font:500 14px/1.4 var(--mono);overflow-wrap:anywhere}
.line b{color:var(--signal);font-weight:600}
ul{list-style:none;margin:28px 0 0;padding:0;border-top:1px solid var(--rule)}
li{border-bottom:1px solid var(--rule)}
li a{display:grid;grid-template-columns:9rem minmax(0,1fr);gap:16px;padding:12px 0;text-decoration:none}
li a span:first-child{font:500 13px/1.5 var(--mono)}
li a span:last-child{color:var(--ink2)}
li a:hover span:first-child{text-decoration:underline}
@media (max-width:520px){li a{grid-template-columns:1fr;gap:2px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/"><img src="/icon.svg" alt="">Human Use</a>
    <nav class="nav"><a href="/install.md">install.md</a><a href="/codes/">codes</a><a href="/llms.txt">llms.txt</a></nav>
  </header>
  <main>
    <h1>Not found.</h1>
    <p class="line"><b>404</b> NOT_FOUND <span id="path"></span></p>
    <ul>
      <li><a href="/"><span>/</span><span>What Human Use is, with the whole catalog</span></a></li>
      <li><a href="/install.md"><span>/install.md</span><span>Install steps, written for an agent</span></a></li>
      <li><a href="/codes/"><span>/codes/</span><span>Every HRT error code</span></a></li>
      <li><a href="/llms.txt"><span>/llms.txt</span><span>Index for language models</span></a></li>
    </ul>
  </main>
</div>
<script>document.getElementById("path").textContent = location.pathname;</script>
</body>
</html>
